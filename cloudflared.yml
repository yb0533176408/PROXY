tunnel: __TUNNEL_ID__
credentials-file: /home/runner/creds.json
protocol: quic
no-autoupdate: true
originRequest:
  noTLSVerify: true
  # XHTTP needs streamed bodies both ways - chunked encoding must stay on.
  disableChunkedEncoding: false
  # packet-up opens many short-lived POSTs; keep the origin pool wide.
  keepAliveConnections: 100
  keepAliveTimeout: 90s
  connectTimeout: 10s
ingress:
  # XHTTP requests are /xh, /xh/<session>, /xh/<session>/<seq>
  - hostname: 1.tsoolgee.uk
    path: ^/xh
    service: http://localhost:8080
  - hostname: 1.tsoolgee.uk
    service: http://localhost:8081
  - hostname: cdn.tsoolgee.uk
    path: ^/xh
    service: http://localhost:8080
  - hostname: cdn.tsoolgee.uk
    service: http://localhost:8081
  - service: http_status:404
