    path: ^/xh
    service: http://localhost:8080
  - hostname: 1.tsoolgee.uk
    service: http://localhost:8081
  - hostname: cdn.tsoolgee.uk
    path: ^/xh
    service: http://localhost:8080
  - hostname: cdn.tsoolgee.uk
    service: http://localhost:8081
