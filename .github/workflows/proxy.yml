name: VMess+WS proxy via Cloudflare Tunnel

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: proxy-server
  cancel-in-progress: true

jobs:
  run-server:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Tune kernel for high-RTT throughput (BBR + big buffers)
        run: |
          sudo sysctl -w net.core.default_qdisc=fq
          sudo sysctl -w net.ipv4.tcp_congestion_control=bbr
          sudo sysctl -w net.core.rmem_max=268435456
          sudo sysctl -w net.core.wmem_max=268435456
          sudo sysctl -w net.ipv4.tcp_rmem="4096 87380 268435456"
          sudo sysctl -w net.ipv4.tcp_wmem="4096 65536 268435456"
          sudo sysctl -w net.ipv4.tcp_fastopen=3
          sudo sysctl -w net.ipv4.tcp_mtu_probing=1
          echo "cc=$(sysctl -n net.ipv4.tcp_congestion_control) qdisc=$(sysctl -n net.core.default_qdisc)"

      - name: Download Xray-core
        run: |
          curl -L -o xray.zip https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
          unzip -o xray.zip xray 2>/dev/null || unzip -o xray.zip
          chmod +x xray
          ./xray version | head -2

      - name: Run Xray (VMess + WS on :8080)
        run: |
          nohup ./xray run -c xray_config.json > xray.log 2>&1 &
          sleep 4
          ss -ltnp 2>/dev/null | grep ':8080' && echo "xray OK on 8080" || { echo "xray NOT up:"; cat xray.log; exit 1; }

      - name: Install cloudflared
        run: |
          curl -L -o cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb
          cloudflared --version

      - name: Build tunnel credentials + config from token
        env:
          CF_TUNNEL_TOKEN: ${{ secrets.CF_TUNNEL_TOKEN }}
        run: |
          python3 - <<'PY'
          import os, base64, json
          t = os.environ['CF_TUNNEL_TOKEN'].strip()
          d = json.loads(base64.b64decode(t + '=='*(-len(t) % 4)))
          tid = d["t"]
          json.dump({"AccountTag": d["a"], "TunnelID": tid,
                     "TunnelSecret": d["s"], "Endpoint": ""},
                    open("/home/runner/creds.json", "w"))
          cfg = ("tunnel: %s\n"
                 "credentials-file: /home/runner/creds.json\n"
                 "protocol: quic\n"
                 "no-autoupdate: true\n"
                 "ingress:\n"
                 "  - hostname: 1.tsoolgee.uk\n"
                 "    service: http://localhost:8080\n"
                 "  - service: http_status:404\n") % tid
          open("cloudflared.yml", "w").write(cfg)
          open("/home/runner/tunnel_id.txt", "w").write(tid + "\n")
          print("SECRET_TUNNEL_ID=" + tid)
          PY

      - name: Run Cloudflare Tunnel
        run: |
          nohup cloudflared tunnel --config cloudflared.yml run > cf.log 2>&1 &
          for i in $(seq 1 20); do
            grep -qiE "Registered tunnel connection" cf.log && break
            sleep 2
          done
          tail -25 cf.log || true

      - name: Self-check + collect diagnostics
        run: |
          {
            echo "=== SECRET_TUNNEL_ID ==="; cat /home/runner/tunnel_id.txt
            echo "=== local 8080/xh ==="
            curl -s -o /dev/null -w "%{http_code}\n" http://127.0.0.1:8080/xh || true
            echo "=== edge 1.tsoolgee.uk/xh (x3) ==="
            for i in 1 2 3; do curl -s -o /dev/null -w "%{http_code}\n" https://1.tsoolgee.uk/xh || true; sleep 2; done
            echo "=== cloudflared registration ==="
            grep -iE "Registered tunnel connection|Starting tunnel|connIndex|error|unauthorized|not found" cf.log | head -15
            echo "=== xray.log tail ==="; tail -15 xray.log
          } > diag.txt 2>&1
          cat diag.txt

      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: diag
          path: diag.txt
          retention-days: 1

      - name: Keep alive (~5h40m) + restart on death
        run: |
          for i in $(seq 1 340); do
            pgrep -f "cloudflared tunnel" > /dev/null || { echo "cf restart"; nohup cloudflared tunnel --config cloudflared.yml run >> cf.log 2>&1 & }
            pgrep -f "xray run" > /dev/null || { echo "xray restart"; nohup ./xray run -c xray_config.json >> xray.log 2>&1 & }
            sleep 60
          done
