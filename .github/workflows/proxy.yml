name: HTTP Proxy via Quick Cloudflare Tunnel

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: proxy-server
  cancel-in-progress: true

jobs:
  run-server:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Tune kernel for high-RTT throughput
        run: |
          sudo sysctl -w net.core.default_qdisc=fq
          sudo sysctl -w net.ipv4.tcp_congestion_control=bbr
          sudo sysctl -w net.core.rmem_max=268435456
          sudo sysctl -w net.core.wmem_max=268435456

      - name: Download Xray-core
        run: |
          curl -L -o xray.zip https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
          unzip -o xray.zip xray 2>/dev/null || unzip -o xray.zip
          chmod +x xray

      - name: Create Xray HTTP Proxy Config (Port 1234)
        run: |
          cat > xray_config.json <<'JSON'
          {
            "log": { "loglevel": "warning" },
            "inbounds": [
              {
                "listen": "127.0.0.1",
                "port": 1234,
                "protocol": "http",
                "settings": {
                  "allowTransparent": false
                }
              }
            ],
            "outbounds": [
              {
                "protocol": "freedom",
                "settings": {}
              }
            ]
          }
          JSON

      - name: Run HTTP Proxy Server
        run: |
          nohup ./xray run -c xray_config.json > xray.log 2>&1 &
          sleep 3
          ss -ltnp | grep ':1234' && echo "HTTP Proxy running on port 1234" || { cat xray.log; exit 1; }

      - name: Install cloudflared
        run: |
          curl -L -o cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb

      - name: Run Quick Cloudflare Tunnel
        run: |
          # הרצת המנהרה הזמנית שמפנה לפורט 1234 המקומי
          nohup cloudflared tunnel --url http://127.0.0.1:1234 > cf.log 2>&1 &
          
          # חילוץ הקישור האקראי מתוך הלוג
          for i in $(seq 1 20); do
            TUNNEL_URL=$(grep -oE 'https://[-a-zA-Z0-9 complexity.]+\.trycloudflare\.com' cf.log | head -n 1 || true)
            if [ -n "$TUNNEL_URL" ]; then
              break
            fi
            sleep 2
          done

          if [ -z "$TUNNEL_URL" ]; then
            echo "Failed to obtain Quick Tunnel URL"
            cat cf.log
            exit 1
          fi

          echo "=========================================="
          echo "YOUR RANDOM PROXY URL: $TUNNEL_URL"
          echo "=========================================="
          
          # שמירת שם המארח בלבד (ללא https://)
          HOST=$(echo "$TUNNEL_URL" | sed -e 's|^https://||')
          echo "$HOST" > /home/runner/tunnel_host.txt

      - name: Keep alive (~5h40m)
        run: |
          for i in $(seq 1 340); do
            pgrep -f "cloudflared" >/dev/null || nohup cloudflared tunnel --url http://127.0.0.1:1234 >> cf.log 2>&1 &
            pgrep -f "xray" >/dev/null || nohup ./xray run -c xray_config.json >> xray.log 2>&1 &
            sleep 60
          done
