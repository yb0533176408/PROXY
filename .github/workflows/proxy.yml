name: HTTP Proxy via Cloudflare Tunnel

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: proxy-server
  cancel-in-progress: true

jobs:
  run-server:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Tune kernel for high-RTT throughput
        run: |
          sudo sysctl -w net.core.default_qdisc=fq
          sudo sysctl -w net.ipv4.tcp_congestion_control=bbr
          sudo sysctl -w net.core.rmem_max=268435456
          sudo sysctl -w net.core.wmem_max=268435456
          sudo sysctl -w net.ipv4.tcp_rmem="4096 87380 268435456"
          sudo sysctl -w net.ipv4.tcp_wmem="4096 65536 268435456"

      - name: Download Xray-core
        run: |
          curl -L -o xray.zip https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
          unzip -o xray.zip xray 2>/dev/null || unzip -o xray.zip
          chmod +x xray

      - name: Create Xray HTTP Proxy Config
        run: |
          cat > xray_http_config.json <<'JSON'
          {
            "log": { "loglevel": "warning" },
            "inbounds": [
              {
                "listen": "127.0.0.1",
                "port": 8080,
                "protocol": "http",
                "settings": {
                  "allowTransparent": false
                }
              }
            ],
            "outbounds": [
              {
                "protocol": "freedom",
                "settings": {}
              }
            ]
          }
          JSON

      - name: Run HTTP Proxy Server
        run: |
          nohup ./xray run -c xray_http_config.json > xray.log 2>&1 &
          sleep 3
          ss -ltnp | grep ':8080' && echo "HTTP Proxy running on port 8080" || { cat xray.log; exit 1; }

      - name: Install cloudflared
        run: |
          curl -L -o cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb

      - name: Build tunnel credentials
        env:
          CF_TUNNEL_TOKEN: ${{ secrets.CF_TUNNEL_TOKEN }}
        run: |
          TID=$(python3 - <<'PY'
          import os, base64, json
          t = os.environ['CF_TUNNEL_TOKEN'].strip()
          d = json.loads(base64.b64decode(t + '=='*(-len(t) % 4)))
          json.dump({"AccountTag": d["a"], "TunnelID": d["t"],
                     "TunnelSecret": d["s"], "Endpoint": ""},
                    open("/home/runner/creds.json", "w"))
          print(d["t"])
          PY
          )
          echo "Tunnel ID: $TID"

      - name: Run Cloudflare Tunnel
        env:
          CF_TUNNEL_TOKEN: ${{ secrets.CF_TUNNEL_TOKEN }}
        run: |
          nohup cloudflared tunnel run --token $CF_TUNNEL_TOKEN > cf.log 2>&1 &
          sleep 5
          grep -iE "Registered tunnel connection" cf.log || head -15 cf.log

      - name: Keep alive (~5h40m)
        run: |
          for i in $(seq 1 340); do
            pgrep -f "cloudflared" >/dev/null || nohup cloudflared tunnel run --token ${{ secrets.CF_TUNNEL_TOKEN }} >> cf.log 2>&1 &
            pgrep -f "xray" >/dev/null || nohup ./xray run -c xray_http_config.json >> xray.log 2>&1 &
            sleep 60
          done
