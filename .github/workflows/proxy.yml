import socket
import threading
import requests
import logging
import uuid
import base64
import zlib

logging.basicConfig(level=logging.INFO, format='%(asctime)s [%(levelname)s] %(message)s')

LOCAL_PORT = 8889
STREAM_URL = "https://1.tsoolgee.uk/api/v1/stream"
SEND_URL = "https://1.tsoolgee.uk/api/v1/send"

session = requests.Session()
adapter = requests.adapters.HTTPAdapter(pool_connections=100, pool_maxsize=100)
session.mount('https://', adapter)
session.headers.update({
    'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/120.0.0.0 Safari/537.36'
})

def handle_client(client_socket, client_address):
    session_id = str(uuid.uuid4())
    logging.info(f"חיבור חדש [Session: {session_id[:8]}] מ: {client_address}")

    stop_event = threading.Event()

    # תהליך קבלה ברצף (Streaming)
    def receive_stream():
        try:
            res = session.get(
                STREAM_URL,
                headers={'X-Session-ID': session_id},
                stream=True,
                timeout=30
            )
            for line in res.iter_lines():
                if stop_event.is_set():
                    break
                if line:
                    compressed = base64.b64decode(line)
                    raw_data = zlib.decompress(compressed)
                    client_socket.sendall(raw_data)
        except Exception:
            pass
        finally:
            stop_event.set()

    threading.Thread(target=receive_stream, daemon=True).start()

    # תהליך שליחה
    try:
        client_socket.settimeout(15.0)
        while not stop_event.is_set():
            try:
                data = client_socket.recv(65536)
            except socket.timeout:
                continue

            if not data:
                break

            compressed = zlib.compress(data)
            encoded = base64.b64encode(compressed).decode('utf-8')

            session.post(
                SEND_URL,
                json={'session_id': session_id, 'payload': encoded},
                timeout=10
            )
    except Exception as e:
        logging.error(f"שגיאה בסשן {session_id[:8]}: {e}")
    finally:
        stop_event.set()
        try:
            client_socket.close()
        except:
            pass
        logging.info(f"נסגר החיבור [Session: {session_id[:8]}]")

def main():
    server = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
    server.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
    server.bind(('127.0.0.1', LOCAL_PORT))
    server.listen(100)
    logging.info(f"מתווך Streaming Proxy מואץ פעיל ב-127.0.0.1:{LOCAL_PORT}")

    while True:
        client, addr = server.accept()
        threading.Thread(target=handle_client, args=(client, addr), daemon=True).start()

if __name__ == '__main__':
    main()
