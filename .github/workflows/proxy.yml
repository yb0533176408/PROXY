name: GitHub Actions Proxy

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Unique run identifier"
        required: true
        default: "manual-run"

permissions:
  contents: write

jobs:
  proxy:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Install packages
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y squid curl python3 python3-pip python3-flask

      - name: Configure Squid
        run: |
          set -e
          sudo tee /etc/squid/squid.conf > /dev/null <<'EOF'
          http_port 127.0.0.1:3128
          acl localhost src 127.0.0.1/32
          http_access allow localhost
          http_access deny all
          cache deny all
          access_log none
          forwarded_for delete
          via off
          request_header_access X-Forwarded-For deny all
          request_header_access Via deny all
          EOF

          sudo squid -k parse
          sudo systemctl restart squid
          sleep 2

      - name: Create HTTP Bridge Server Script
        run: |
          cat << 'EOF' > http_proxy_server.py
          from flask import Flask, request, jsonify
          import socket
          import base64

          app = Flask(__name__)
          SQUID_ADDR = ('127.0.0.1', 3128)
          SESSIONS = {}

          @app.route('/api/v1/update', methods=['POST'])
          def update_api():
              data = request.get_json(silent=True) or {}
              session_id = data.get('session_id')
              raw_payload = data.get('payload', '')

              if not session_id:
                  return jsonify({'status': 'error', 'message': 'missing session'}), 400

              if session_id not in SESSIONS:
                  try:
                      s = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
                      s.connect(SQUID_ADDR)
                      s.settimeout(4.0)
                      SESSIONS[session_id] = s
                  except Exception as e:
                      return jsonify({'status': 'error', 'details': str(e)}), 502

              s = SESSIONS[session_id]

              if raw_payload:
                  try:
                      decoded_bytes = base64.b64decode(raw_payload)
                      s.sendall(decoded_bytes)
                  except Exception:
                      pass

              response_bytes = b""
              while True:
                  try:
                      chunk = s.recv(4096)
                      if not chunk:
                          break
                      response_bytes += chunk
                  except socket.timeout:
                      break
                  except Exception:
                      SESSIONS.pop(session_id, None)
                      break

              encoded_response = base64.b64encode(response_bytes).decode('utf-8')
              return jsonify({'status': 'ok', 'data': encoded_response})

          if __name__ == '__main__':
              app.run(host='0.0.0.0', port=8080)
          EOF

      - name: Start HTTP Bridge Server
        run: |
          set -e
          nohup python3 http_proxy_server.py > server.log 2>&1 &
          echo "$!" > server.pid
          sleep 3

      - name: Install Cloudflared
        run: |
          set -e
          curl -L --fail --silent --show-error -o cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb

      - name: Start Cloudflare Named Tunnel
        run: |
          set -e
          rm -f tunnel.log tunnel.pid

          nohup cloudflared tunnel run --token ${{ secrets.CF_TUNNEL_TOKEN }} > tunnel.log 2>&1 &
          echo "$!" > tunnel.pid

          echo ""
          echo "=============================================="
          echo " HTTP API Active: https://1.tsoolgee.uk/api/v1/update"
          echo "=============================================="

      - name: Keep Alive
        run: |
          while true; do
            sleep 60
            if ! sudo systemctl is-active --quiet squid; then
              sudo systemctl restart squid
            fi
            if ! kill -0 "$(cat server.pid)" 2>/dev/null; then
              exit 1
            fi
            if ! kill -0 "$(cat tunnel.pid)" 2>/dev/null; then
              exit 1
            fi
          done
