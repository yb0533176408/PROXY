name: GitHub Actions Proxy

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Unique run identifier"
        required: true
        default: "manual-run"

permissions:
  contents: write

jobs:
  proxy:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Install packages
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y squid curl python3 python3-pip
          python3 -m pip install --break-system-packages aiohttp

      - name: Configure Squid
        run: |
          set -e
          sudo tee /etc/squid/squid.conf > /dev/null <<'EOF'
          http_port 127.0.0.1:3128
          acl localhost src 127.0.0.1/32
          http_access allow localhost
          http_access deny all
          cache deny all
          access_log none
          forwarded_for delete
          via off
          request_header_access X-Forwarded-For deny all
          request_header_access Via deny all
          EOF

          sudo squid -k parse
          sudo systemctl restart squid
          sleep 2

      - name: Create Async HTTP Server Script
        run: |
          cat << 'EOF' > http_proxy_server.py
          import base64
          import zlib
          import asyncio
          from aiohttp import web

          SQUID_HOST = '127.0.0.1'
          SQUID_PORT = 3128
          SESSIONS = {}

          async def handle_update(request):
              try:
                  data = await request.json()
              except Exception:
                  return web.json_response({'status': 'error', 'message': 'invalid json'}, status=400)

              session_id = data.get('session_id')
              raw_payload = data.get('payload', '')

              if not session_id:
                  return web.json_response({'status': 'error', 'message': 'missing session'}, status=400)

              if session_id not in SESSIONS:
                  try:
                      reader, writer = await asyncio.wait_for(
                          asyncio.open_connection(SQUID_HOST, SQUID_PORT), timeout=4.0
                      )
                      SESSIONS[session_id] = (reader, writer)
                  except Exception as e:
                      return web.json_response({'status': 'error', 'details': str(e)}, status=502)

              reader, writer = SESSIONS[session_id]

              if raw_payload:
                  try:
                      compressed_data = base64.b64decode(raw_payload)
                      decompressed_data = zlib.decompress(compressed_data)
                      writer.write(decompressed_data)
                      await writer.drain()
                  except Exception:
                      pass

              response_bytes = b""
              while True:
                  try:
                      chunk = await asyncio.wait_for(reader.read(65536), timeout=0.05)
                      if not chunk:
                          break
                      response_bytes += chunk
                  except asyncio.TimeoutError:
                      break
                  except Exception:
                      SESSIONS.pop(session_id, None)
                      break

              encoded_response = ""
              if response_bytes:
                  compressed_res = zlib.compress(response_bytes)
                  encoded_response = base64.b64encode(compressed_res).decode('utf-8')

              return web.json_response({'status': 'ok', 'data': encoded_response})

          app = web.Application()
          app.router.add_post('/api/v1/update', handle_update)

          if __name__ == '__main__':
              web.run_app(app, host='0.0.0.0', port=8080)
          EOF

      - name: Start Async HTTP Server
        run: |
          set -e
          nohup python3 http_proxy_server.py > server.log 2>&1 &
          echo "$!" > server.pid
          sleep 3

      - name: Install Cloudflared
        run: |
          set -e
          curl -L --fail --silent --show-error -o cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb

      - name: Start Cloudflare Named Tunnel
        run: |
          set -e
          rm -f tunnel.log tunnel.pid

          nohup cloudflared tunnel run --token ${{ secrets.CF_TUNNEL_TOKEN }} > tunnel.log 2>&1 &
          echo "$!" > tunnel.pid

          echo ""
          echo "=============================================="
          echo " Accelerated Proxy API Active: https://1.tsoolgee.uk/api/v1/update"
          echo "=============================================="

      - name: Keep Alive
        run: |
          while true; do
            sleep 60
            if ! sudo systemctl is-active --quiet squid; then
              sudo systemctl restart squid
            fi
            if ! kill -0 "$(cat server.pid)" 2>/dev/null; then
              exit 1
            fi
            if ! kill -0 "$(cat tunnel.pid)" 2>/dev/null; then
              exit 1
            fi
          done
