name: Run Async Proxy Server

on:
  workflow_dispatch: # מאפשר הרצה ידנית מתוך ממשק ה-GitHub
  push:
    branches:
      - main

jobs:
  run-server:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install aiohttp numpy uvloop httpx

      - name: Install and start Squid (Local Proxy Service)
        run: |
          sudo apt-get update
          sudo apt-get install -y squid
          sudo systemctl start squid

      - name: Run Proxy Server
        run: |
          python server.py
