name: Run Async Proxy Server with Cloudflare Tunnel

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  run-server:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download Xray-core
        run: |
          curl -L -o xray.zip https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
          unzip -o xray.zip xray geoip.dat geosite.dat 2>/dev/null || unzip -o xray.zip
          chmod +x xray
          ./xray version | head -2

      - name: Run Xray (VLESS + XHTTP on :8080)
        run: |
          nohup ./xray run -c xray_config.json > xray.log 2>&1 &
          sleep 4
          sudo ss -ltnp 2>/dev/null | grep ':8080' && echo "xray OK on 8080" || { echo "xray NOT up:"; cat xray.log; }

      - name: Install Cloudflared
        run: |
          curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb

      - name: Run Cloudflare Tunnel
        env:
          TUNNEL_TOKEN: ${{ secrets.CF_TUNNEL_TOKEN }}
        run: |
          cloudflared tunnel --no-autoupdate run --token $TUNNEL_TOKEN
