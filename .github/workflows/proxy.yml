name: Run Async Proxy Server with Cloudflare Tunnel

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  run-server:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install websockify
        run: |
          python -m pip install --upgrade pip
          pip install websockify numpy

      - name: Install and start Squid Proxy
        run: |
          sudo apt-get update
          sudo apt-get install -y squid
          sudo squid -z 2>/dev/null || true
          sudo service squid start 2>/dev/null || sudo squid 2>/dev/null || true
          sleep 3
          sudo ss -ltnp 2>/dev/null | grep ':3128' && echo "squid OK on 3128" || echo "WARN: squid not on 3128"

      # WebSocket -> Squid  (זו ה"שפה הישנה" שה-ProxyClient.exe מדבר).
      # NetFree מעביר WebSocket חי frame-by-frame, בלי ה-buffering ששובר HTTP-streaming.
      - name: Start websockify (WS 8080 -> Squid 3128)
        run: |
          nohup websockify 0.0.0.0:8080 127.0.0.1:3128 > ws.log 2>&1 &
          sleep 5
          sudo ss -ltnp 2>/dev/null | grep ':8080' && echo "websockify OK on 8080" || { echo "websockify NOT up:"; cat ws.log; }

      - name: Install Cloudflared
        run: |
          curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb

      - name: Run Cloudflare Tunnel
        env:
          TUNNEL_TOKEN: ${{ secrets.CF_TUNNEL_TOKEN }}
        run: |
          cloudflared tunnel --no-autoupdate run --token $TUNNEL_TOKEN
