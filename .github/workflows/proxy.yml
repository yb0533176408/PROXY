name: Run Async Proxy Server with Cloudflare Tunnel

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  run-server:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install aiohttp numpy uvloop httpx

      - name: Install and start Squid Proxy
        run: |
          sudo apt-get update
          sudo apt-get install -y squid
          # systemctl start squid נתקע לפעמים על הרנר; מפעילים ישירות במקום.
          sudo squid -z 2>/dev/null || true
          sudo service squid start 2>/dev/null || sudo squid 2>/dev/null || true
          sleep 3
          sudo ss -ltnp 2>/dev/null | grep ':3128' && echo "squid OK on 3128" || echo "WARN: squid not on 3128"

      - name: Run Proxy Server in background
        run: |
          nohup python server.py > proxy_server.log 2>&1 &
          sleep 4
          sudo ss -ltnp 2>/dev/null | grep ':8080' && echo "server.py OK on 8080" || { echo "server.py NOT up:"; cat proxy_server.log; }

      - name: Install Cloudflared
        run: |
          curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb

      - name: Run Cloudflare Tunnel
        env:
          TUNNEL_TOKEN: ${{ secrets.CF_TUNNEL_TOKEN }}
        run: |
          cloudflared tunnel --no-autoupdate run --token $TUNNEL_TOKEN
