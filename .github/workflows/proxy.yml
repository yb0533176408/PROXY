name: VMess+XHTTP proxy via Cloudflare Tunnel

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: proxy-server
  cancel-in-progress: true

jobs:
  run-server:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Tune kernel for high-RTT throughput (BBR + big buffers)
        run: |
          sudo sysctl -w net.core.default_qdisc=fq
          sudo sysctl -w net.ipv4.tcp_congestion_control=bbr
          sudo sysctl -w net.core.rmem_max=268435456
          sudo sysctl -w net.core.wmem_max=268435456
          sudo sysctl -w net.ipv4.tcp_rmem="4096 87380 268435456"
          sudo sysctl -w net.ipv4.tcp_wmem="4096 65536 268435456"
          sudo sysctl -w net.ipv4.tcp_fastopen=3
          sudo sysctl -w net.ipv4.tcp_mtu_probing=1
          echo "cc=$(sysctl -n net.ipv4.tcp_congestion_control)"

      - name: Download Xray-core
        run: |
          curl -L -o xray.zip https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
          unzip -o xray.zip xray 2>/dev/null || unzip -o xray.zip
          chmod +x xray
          ./xray version | head -2

      - name: Run Xray (VMess + XHTTP on :8080) + decoy site (:8081)
        run: |
          nohup ./xray run -c xray_config.json > xray.log 2>&1 &
          nohup python3 decoy/serve.py 8081 > decoy.log 2>&1 &
          sleep 4
          ss -ltnp 2>/dev/null | grep ':8080' && echo "xray OK" || { echo "xray NOT up:"; cat xray.log; exit 1; }
          ss -ltnp 2>/dev/null | grep ':8081' && echo "decoy OK" || { echo "decoy NOT up:"; cat decoy.log; }
          curl -s -o /dev/null -w "decoy local / -> %{http_code}\n" http://127.0.0.1:8081/

      - name: Install cloudflared
        run: |
          curl -L -o cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb
          cloudflared --version

      - name: Build tunnel credentials + inject tunnel id
        env:
          CF_TUNNEL_TOKEN: ${{ secrets.CF_TUNNEL_TOKEN }}
        run: |
          TID=$(python3 - <<'PY'
          import os, base64, json
          t = os.environ['CF_TUNNEL_TOKEN'].strip()
          d = json.loads(base64.b64decode(t + '=='*(-len(t) % 4)))
          json.dump({"AccountTag": d["a"], "TunnelID": d["t"],
                     "TunnelSecret": d["s"], "Endpoint": ""},
                    open("/home/runner/creds.json", "w"))
          print(d["t"])
          PY
          )
          echo "tunnel id: $TID"
          sed -i "s/__TUNNEL_ID__/$TID/" cloudflared.yml
          echo "$TID" > /home/runner/tunnel_id.txt
          cat cloudflared.yml

      - name: Run Cloudflare Tunnel
        run: |
          nohup cloudflared tunnel --config cloudflared.yml run > cf.log 2>&1 &
          for i in $(seq 1 20); do grep -qiE "Registered tunnel connection" cf.log && break; sleep 2; done
          tail -12 cf.log || true

      - name: End-to-end test through the edge (real XHTTP client)
        run: |
          cat > client_test.json <<'JSON'
          {
            "log": { "loglevel": "warning" },
            "inbounds": [
              { "listen": "127.0.0.1", "port": 10808, "protocol": "socks",
                "settings": { "udp": false } }
            ],
            "outbounds": [
              {
                "protocol": "vmess",
                "settings": {
                  "vnext": [{
                    "address": "1.tsoolgee.uk",
                    "port": 443,
                    "users": [{ "id": "b7d37230-8508-4f0d-bd14-21d09c93eb9f",
                                "alterId": 0, "security": "auto" }]
                  }]
                },
                "streamSettings": {
                  "network": "xhttp",
                  "security": "tls",
                  "tlsSettings": { "serverName": "1.tsoolgee.uk" },
                  "xhttpSettings": { "path": "/xh", "host": "1.tsoolgee.uk", "mode": "packet-up" }
                }
              }
            ]
          }
          JSON
          nohup ./xray run -c client_test.json > client.log 2>&1 &
          sleep 4
          IP=$(curl -s --max-time 25 --socks5-hostname 127.0.0.1:10808 https://ipinfo.io/ip || true)
          if [ -n "$IP" ]; then echo "E2E=OK egress_ip=$IP" | tee /home/runner/e2e.txt;
          else echo "E2E=FAIL" | tee /home/runner/e2e.txt; tail -20 client.log; tail -20 xray.log; fi
          pkill -f "client_test.json" || true

      - name: Self-check + diagnostics
        run: |
          {
            echo "=== E2E (runner -> edge -> xray) ==="; cat /home/runner/e2e.txt 2>/dev/null || echo "no result"
            echo "=== TUNNEL_ID ==="; cat /home/runner/tunnel_id.txt
            echo "=== local xray 8080/xh (bare GET, 404/400 is normal) ==="
            curl -s -o /dev/null -w "%{http_code}\n" http://127.0.0.1:8080/xh
            echo "=== local decoy 8081/ ==="; curl -s -o /dev/null -w "%{http_code}\n" http://127.0.0.1:8081/
            for host in 1.tsoolgee.uk cdn.tsoolgee.uk; do
              echo "=== edge $host / (decoy) ==="; curl -s -o /dev/null -w "%{http_code}\n" https://$host/ || true
              echo "=== edge $host /xh (xray) ==="; curl -s -o /dev/null -w "%{http_code}\n" https://$host/xh || true
              echo "=== edge $host /xh upgrade-free POST ==="
              curl -s -o /dev/null -w "%{http_code} http_version=%{http_version}\n" \
                   -X POST --data-binary "test" https://$host/xh/probe/0 || true
            done
            echo "=== cf registration ==="; grep -iE "Registered tunnel connection|error|unauthorized" cf.log | head -8
          } > diag.txt 2>&1
          cat diag.txt

      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: diag
          path: diag.txt
          retention-days: 1

      - name: Keep alive (~5h40m) + restart on death
        run: |
          for i in $(seq 1 340); do
            pgrep -f "cloudflared tunnel" >/dev/null || { echo cf-restart; nohup cloudflared tunnel --config cloudflared.yml run >> cf.log 2>&1 & }
            pgrep -f "xray run -c xray_config.json" >/dev/null || { echo xray-restart; nohup ./xray run -c xray_config.json >> xray.log 2>&1 & }
            pgrep -f "decoy/serve.py" >/dev/null || { echo decoy-restart; nohup python3 decoy/serve.py 8081 >> decoy.log 2>&1 & }
            sleep 60
          done
