name: Raw-TCP survival probe (bore)

on:
  workflow_dispatch:

concurrency:
  group: tcp-probe
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download bore (raw-TCP tunnel)
        run: |
          curl -L -o bore.tgz https://github.com/ekzhang/bore/releases/download/v0.5.1/bore-v0.5.1-x86_64-unknown-linux-musl.tar.gz
          tar xzf bore.tgz
          chmod +x bore
          ./bore --version

      - name: Start PostgreSQL-mimic server on :5432
        run: |
          nohup python3 probe/pg_probe_server.py 5432 > srv.log 2>&1 &
          sleep 2
          ss -ltnp 2>/dev/null | grep ':5432' && echo "pg-mimic up" || { echo "NOT up"; cat srv.log; exit 1; }

      - name: Open bore tunnel on :5432
        run: |
          nohup ./bore local 5432 --to bore.pub --port 5432 > bore.log 2>&1 &
          sleep 5
          GOT=$(grep -oE 'bore\.pub:[0-9]+' bore.log | head -1)
          if [ -z "$GOT" ]; then echo "no endpoint"; cat bore.log; exit 1; fi
          echo "ENDPOINT=$GOT"; echo "$GOT" > /tmp/ep.txt

      - name: Publish endpoint
        run: |
          cp /tmp/ep.txt ep.txt
          git config user.name  "probe-bot"
          git config user.email "probe-bot@users.noreply.github.com"
          git checkout --orphan probe-status
          git reset >/dev/null 2>&1 || true
          git add -f ep.txt
          git commit -m "pg endpoint" >/dev/null
          git push -f origin probe-status
          echo "published $(cat ep.txt)"

      - name: Hold open ~6 min
        run: |
          for i in $(seq 1 36); do
            pgrep -f "bore local 5432" >/dev/null || nohup ./bore local 5432 --to bore.pub --port 5432 >> bore.log 2>&1 &
            pgrep -f pg_probe_server >/dev/null || nohup python3 probe/pg_probe_server.py 5432 >> srv.log 2>&1 &
            sleep 10
          done
          echo "==== server log tail ===="; tail -80 srv.log
