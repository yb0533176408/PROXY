name: Raw-TCP survival probe (bore)

on:
  workflow_dispatch:

concurrency:
  group: tcp-probe
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download bore
        run: |
          curl -L -o bore.tgz https://github.com/ekzhang/bore/releases/download/v0.5.1/bore-v0.5.1-x86_64-unknown-linux-musl.tar.gz
          tar xzf bore.tgz && chmod +x bore && ./bore --version

      - name: Start SMTP-mimic server on :2525
        run: |
          nohup python3 probe/smtp_probe_server.py 2525 > srv.log 2>&1 &
          sleep 2
          ss -ltnp 2>/dev/null | grep ':2525' && echo "smtp-mimic up" || { cat srv.log; exit 1; }

      - name: Open bore tunnels (SMTP ports + a high port)
        run: |
          : > /tmp/eps.txt
          for want in 587 25 465 2525 0; do
            nohup ./bore local 2525 --to bore.pub --port $want > bore-$want.log 2>&1 &
            sleep 4
            GOT=$(grep -oE 'bore\.pub:[0-9]+' bore-$want.log | head -1)
            if [ -n "$GOT" ]; then echo "req $want -> $GOT"; echo "$want $GOT" >> /tmp/eps.txt
            else echo "req $want -> DENIED:"; tail -1 bore-$want.log; fi
          done
          echo "=== granted ==="; cat /tmp/eps.txt

      - name: Publish endpoints
        run: |
          cp /tmp/eps.txt eps.txt
          git config user.name probe-bot
          git config user.email probe-bot@users.noreply.github.com
          git checkout --orphan probe-status
          git reset >/dev/null 2>&1 || true
          git add -f eps.txt
          git commit -m "smtp endpoints" >/dev/null
          git push -f origin probe-status
          echo published; cat eps.txt

      - name: Hold open ~6 min
        run: |
          for i in $(seq 1 36); do
            for want in 587 25 465 2525 0; do
              pgrep -f "bore local 2525 --to bore.pub --port $want" >/dev/null || \
                nohup ./bore local 2525 --to bore.pub --port $want >> bore-$want.log 2>&1 &
            done
            pgrep -f smtp_probe_server >/dev/null || nohup python3 probe/smtp_probe_server.py 2525 >> srv.log 2>&1 &
            sleep 10
          done
          echo "==== srv.log tail ===="; tail -80 srv.log
